<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0e1525"/>
      <stop offset="100%" stop-color="#0b0d15"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="25%" r="30%">
      <stop offset="0%" stop-color="#4a8ac4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4a8ac4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="300" cy="120" r="200" fill="url(#starGlow)"/>
  <!-- Constellation: Orion-like, large -->
  <circle cx="220" cy="80" r="4" fill="#f5c36a" fill-opacity="0.95"/>
  <circle cx="380" cy="75" r="3.5" fill="#f5c36a" fill-opacity="0.9"/>
  <circle cx="260" cy="150" r="3" fill="#f5c36a" fill-opacity="0.85"/>
