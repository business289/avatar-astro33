  <line x1="380" y1="75" x2="340" y2="145" stroke="#4a8ac4" stroke-width="0.7" stroke-opacity="0.4"/>
  <line x1="260" y1="150" x2="300" y2="165" stroke="#4a8ac4" stroke-width="0.6" stroke-opacity="0.35"/>
  <line x1="340" y1="145" x2="300" y2="165" stroke="#4a8ac4" stroke-width="0.6" stroke-opacity="0.35"/>
  <line x1="260" y1="150" x2="230" y2="230" stroke="#4a8ac4" stroke-width="0.6" stroke-opacity="0.35"/>
  <line x1="340" y1="145" x2="370" y2="225" stroke="#4a8ac4" stroke-width="0.6" stroke-opacity="0.35"/>
  <line x1="230" y1="230" x2="370" y2="225" stroke="#4a8ac4" stroke-width="0.5" stroke-opacity="0.3"/>
  <line x1="230" y1="230" x2="180" y2="290" stroke="#4a8ac4" stroke-width="0.5" stroke-opacity="0.3"/>
  <line x1="370" y1="225" x2="420" y2="285" stroke="#4a8ac4" stroke-width="0.5" stroke-opacity="0.3"/>
  <!-- Random background stars -->
  <circle cx="60" cy="30" r="1.5" fill="#f5c36a" fill-opacity="0.7"/>
  <circle cx="520" cy="50" r="1.5" fill="#f5c36a" fill-opacity="0.6"/>
  <circle cx="100" cy="150" r="1" fill="#f5c36a" fill-opacity="0.5"/>
  <circle cx="490" cy="170" r="1" fill="#f5c36a" fill-opacity="0.5"/>
  <circle cx="150" cy="340" r="1.5" fill="#f5c36a" fill-opacity="0.5"/>
  <circle cx="450" cy="350" r="1" fill="#f5c36a" fill-opacity="0.4"/>
