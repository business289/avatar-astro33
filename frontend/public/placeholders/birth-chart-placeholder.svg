<svg width="640" height="520" viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg">
  <!-- back panel: kundli chart -->
  <g transform="translate(210,80) rotate(-6)">
    <rect width="300" height="300" rx="10" fill="#efe3cd" stroke="#c9a25f" stroke-width="2"/>
    <g stroke="#8a6a3a" stroke-opacity="0.55" stroke-width="1.5">
      <line x1="0" y1="0" x2="300" y2="300"/>
      <line x1="300" y1="0" x2="0" y2="300"/>
      <line x1="150" y1="0" x2="0" y2="150"/>
      <line x1="150" y1="0" x2="300" y2="150"/>
      <line x1="0" y1="150" x2="150" y2="300"/>
      <line x1="300" y1="150" x2="150" y2="300"/>
    </g>
    <text x="150" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#8a6a3a">Su Me</text>
    <text x="150" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#8a6a3a">Ma Ra</text>
    <text x="18" y="155" font-family="Georgia, serif" font-size="13" fill="#8a6a3a">Ju</text>
    <text x="270" y="155" font-family="Georgia, serif" font-size="13" fill="#8a6a3a">Ve</text>
  </g>

  <!-- front panel: planets list -->
  <g transform="translate(330,150)">
    <rect width="260" height="290" rx="14" fill="#0f2038" stroke="#e8935f" stroke-opacity="0.5" stroke-width="2"/>
    <text x="20" y="34" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" opacity="0.9">Planets</text>
    <g font-family="Arial, sans-serif" font-size="11" fill="#e8935f" opacity="0.5">
      <text x="20" y="58">Planet</text>
      <text x="130" y="58">Sign</text>
      <text x="200" y="58">Degree</text>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.08">
      <line x1="14" y1="68" x2="246" y2="68"/>
      <line x1="14" y1="98" x2="246" y2="98"/>
      <line x1="14" y1="128" x2="246" y2="128"/>
      <line x1="14" y1="158" x2="246" y2="158"/>
      <line x1="14" y1="188" x2="246" y2="188"/>
    </g>
    <g fill="#e8935f">
      <circle cx="26" cy="83" r="7"/>
      <circle cx="26" cy="113" r="7" fill="#8fb8e8"/>
      <circle cx="26" cy="143" r="7" fill="#e8926a"/>
      <circle cx="26" cy="173" r="7" fill="#d9a8e0"/>
    </g>
    <g font-family="Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.75">
      <text x="44" y="87">Sun</text>
      <text x="44" y="117">Moon</text>
      <text x="44" y="147">Mars</text>
      <text x="44" y="177">Venus</text>
      <text x="130" y="87">Leo</text>
      <text x="130" y="117">Cancer</text>
      <text x="130" y="147">Aries</text>
      <text x="130" y="177">Libra</text>
    </g>
  </g>

  <text x="20" y="500" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#ffffff" fill-opacity="0.3">PLACEHOLDER ARTWORK</text>
</svg>
