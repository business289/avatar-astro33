  <text x="40" y="452" font-family="Arial, sans-serif" font-size="15" letter-spacing="3" fill="#e8935f" fill-opacity="0.9">LIVE DARSHAN</text>
  <text x="760" y="40" text-anchor="end" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#ffffff" fill-opacity="0.35">PLACEHOLDER</text>
